buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
        classpath "gradle.plugin.com.matthewprenger:CurseGradle:1.4.0"
        classpath group: 'com.modrinth.minotaur', name: 'Minotaur', version: '2+'
    }
}


apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'idea'

group = 'net.market.realmarket'
version = '1.0'
java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21)) // мод під Java 21
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(21) // байткод сумісний з JVM 21
    options.encoding = 'UTF-8'
}
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            args '--username', 'Chaos1924'
            mods { create("realmarket") { source sourceSets.main } }
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            args 'nogui'
            mods { create("realmarket") { source sourceSets.main } }
        }

    }
}


repositories {
    maven {
        name "Modmaven"
        url "https://modmaven.dev/"
        // For Gradle 5.1 and above, limit it to just AE2
        content {
            includeGroup 'appeng'
        }
    }
}



dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.29'
    implementation 'org.java-websocket:Java-WebSocket:1.5.3'

    compileOnly "org.appliedenergistics:appliedenergistics2:19.2.4"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}