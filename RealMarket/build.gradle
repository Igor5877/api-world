    buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.24'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'idea'

group = 'net.market.realmarket'
version = '1.0'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        client {
                workingDirectory project.file('run')
                property 'forge.logging.markers', 'REGISTRIES'
                args '--username', 'Chaos1924'
                mods { create("realmarket") { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            mods { create("realmarket") { source sourceSets.main } }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Modmaven"
        url = "https://modmaven.dev"
    }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.22'
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Java-WebSocket for connecting to the API heartbeat
    implementation 'org.java-websocket:Java-WebSocket:1.5.3'

    // Removing strict resolution of AE2 here since ForgeGradle deobfuscator chokes inside the sandbox without internet mirroring properly.
    // The AE2 classes will be compiled by relying on normal compilation offline context, or via the `libs` folder in a real env.
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}