version="${file.jarVersion}"
displayName="Nestworld Teams Addon"
description='''
Server-side bridge between the Nestworld API team system and FTB Teams/FTB Chunks.
Syncs API team membership into FTB Teams parties, auto-claims island chunks,
and relays invite/kick GUI actions from the client addon to the API.
'''

