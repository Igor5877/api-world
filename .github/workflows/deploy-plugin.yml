name: Deploy Velocity Plugin to Production
# Triggered by tags matching plugin-v* (e.g. plugin-v1.1.0).
# workflow_dispatch lets you override the target container for emergency hotfixes.
# Only tag a commit that has already been verified healthy on DEV via ci-dev.yml.
#
# Required secrets: SSH_PRIVATE_KEY, SERVER_HOST, SERVER_USER, SERVER_PORT
# Required vars:    VELOCITY_CONTAINER_NAME, LXD_PROJECT_NAME, VELOCITY_DEST_PATH
# Optional vars:    VELOCITY_RESTART_CMD, VELOCITY_HEALTH_TARGET

on:
  push:
    tags:
      - 'plugin-v*'
  workflow_dispatch:
    inputs:
      container_name:
        description: 'Override target LXC container (leave empty to use VELOCITY_CONTAINER_NAME var)'
        required: false
        default: ''

jobs:
  # ── 1. Build ──────────────────────────────────────────────────────────────
  build:
    uses: ./.github/workflows/_build-java.yml
    with:
      module_path:   Nestworldvelocity
      artifact_name: prod-plugin-jar

  # ── 2. Deploy to production with rollback ─────────────────────────────────
  deploy:
    needs: build
    uses: ./.github/workflows/_deploy-lxc-jar.yml
    with:
      artifact_name:          prod-plugin-jar
      jar_name:               ${{ needs.build.outputs.jar_name }}
      lxc_container:          ${{ github.event.inputs.container_name || vars.VELOCITY_CONTAINER_NAME }}
      lxc_project:            ${{ vars.LXD_PROJECT_NAME }}
      dest_path:              ${{ vars.VELOCITY_DEST_PATH }}
      restart_command:        ${{ vars.VELOCITY_RESTART_CMD }}
      health_type:            minecraft
      health_target:          ${{ vars.VELOCITY_HEALTH_TARGET }}
      health_timeout_minutes: 5
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_HOST:     ${{ secrets.SERVER_HOST }}
      SERVER_USER:     ${{ secrets.SERVER_USER }}
      SERVER_PORT:     ${{ secrets.SERVER_PORT }}
