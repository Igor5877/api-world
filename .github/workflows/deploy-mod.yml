name: Deploy Server Mod to Production
# Triggered by tags matching mod-v* (e.g. mod-v1.2.3).
# workflow_dispatch lets you override the target container for emergency hotfixes.
# Only tag a commit that has already been verified healthy on DEV via ci-dev.yml.
#
# Required secrets: SSH_PRIVATE_KEY, SERVER_HOST, SERVER_USER, SERVER_PORT
# Required vars:    MOD_CONTAINER_NAME, LXD_PROJECT_NAME, MOD_DEST_PATH
# Optional vars:    MOD_RESTART_CMD, MOD_HEALTH_TARGET

on:
  push:
    tags:
      - 'mod-v*'
  workflow_dispatch:
    inputs:
      container_name:
        description: 'Override target LXC container (leave empty to use MOD_CONTAINER_NAME var)'
        required: false
        default: ''

jobs:
  # ── 1. Build ──────────────────────────────────────────────────────────────
  build:
    uses: ./.github/workflows/_build-java.yml
    with:
      module_path:   mods-server
      artifact_name: prod-mod-jar
      jar_pattern:   "nestworld-mods-server-*.jar"

  # ── 2. Deploy to production with rollback ─────────────────────────────────
  deploy:
    needs: build
    uses: ./.github/workflows/_deploy-lxc-jar.yml
    with:
      artifact_name:          prod-mod-jar
      jar_name:               ${{ needs.build.outputs.jar_name }}
      lxc_container:          ${{ github.event.inputs.container_name || vars.MOD_CONTAINER_NAME }}
      lxc_project:            ${{ vars.LXD_PROJECT_NAME }}
      dest_path:              ${{ vars.MOD_DEST_PATH }}
      restart_command:        ${{ vars.MOD_RESTART_CMD }}
      health_type:            minecraft
      health_target:          ${{ vars.MOD_HEALTH_TARGET }}
      health_timeout_minutes: 15
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_HOST:     ${{ secrets.SERVER_HOST }}
      SERVER_USER:     ${{ secrets.SERVER_USER }}
      SERVER_PORT:     ${{ secrets.SERVER_PORT }}
