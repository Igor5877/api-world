name: "[Hotfix] Deploy API to Production"
# Manual-only hotfix deploy for the API.
# Normal releases go through deploy-release.yml (tag V*).
# Use this only to deploy a single module without a full release.

on:
  workflow_dispatch:

jobs:
  # ── 1. Tests must pass on the tagged commit ─────────────────────────────────
  test:
    uses: ./.github/workflows/_test-python.yml
    with:
      test_path: "api/app/tests"
      pytest_args: "-v"

  # ── 2. Deploy to production with rollback on failure ─────────────────────────
  deploy:
    needs: test
    uses: ./.github/workflows/_deploy-api-ssh.yml
    with:
      deploy_sha:   ${{ github.sha }}
      api_path:     ${{ vars.API_PATH     || '/srv/skyblock/api' }}
      service_name: ${{ vars.API_SERVICE  || 'skyblock_api.service' }}
      health_url:   ${{ vars.API_HEALTH_URL || 'http://localhost:8000/' }}
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_HOST:     ${{ secrets.SERVER_HOST }}
      SERVER_USER:     ${{ secrets.SERVER_USER }}
      SERVER_PORT:     ${{ secrets.SERVER_PORT }}
