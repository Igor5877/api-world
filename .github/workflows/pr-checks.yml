name: Branch & PR Checks
# Runs on every push to any feature branch AND on pull requests to main.
# Only checks modules that actually changed — skips everything else.
# The final `all-checks-passed` job is the single required status check to
# configure in branch protection — it succeeds even when some modules were
# skipped (nothing changed in them).

on:
  push:
    branches-ignore:
      - main        # main is handled by ci-dev.yml after merge
  pull_request:
    branches:
      - main

jobs:
  # ── 1. Detect which modules changed ────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      api:        ${{ steps.filter.outputs.api }}
      mod:        ${{ steps.filter.outputs.mod }}
      plugin:     ${{ steps.filter.outputs.plugin }}
      realmarket: ${{ steps.filter.outputs.realmarket }}
      sales:      ${{ steps.filter.outputs.sales }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'requirements.txt'
            mod:
              - 'mods-server/**'
            plugin:
              - 'Nestworldvelocity/**'
            realmarket:
              - 'RealMarket/**'
            sales:
              - 'sales-addon/**'

  # ── 2. Module checks (conditional) ─────────────────────────────────────────
  check-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/_test-python.yml
    with:
      test_path: "api/app/tests"
      pytest_args: "-v"

  build-mod:
    needs: changes
    if: needs.changes.outputs.mod == 'true'
    uses: ./.github/workflows/_build-java.yml
    with:
      module_path: mods-server
      artifact_name: pr-mod-jar
      jar_pattern: "nestworld-mods-server-*.jar"

  build-plugin:
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    uses: ./.github/workflows/_build-java.yml
    with:
      module_path: Nestworldvelocity
      artifact_name: pr-plugin-jar

  build-realmarket:
    needs: changes
    if: needs.changes.outputs.realmarket == 'true'
    uses: ./.github/workflows/_build-java.yml
    with:
      module_path: RealMarket
      artifact_name: pr-realmarket-jar

  build-sales:
    needs: changes
    if: needs.changes.outputs.sales == 'true'
    uses: ./.github/workflows/_build-java.yml
    with:
      module_path: sales-addon
      artifact_name: pr-sales-jar

  # ── 3. Required gate (always runs) ─────────────────────────────────────────
  # Set THIS job as the required status check in branch protection settings.
  # It fails if any module check failed; it succeeds if all passed or were skipped.
  all-checks-passed:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - check-api
      - build-mod
      - build-plugin
      - build-realmarket
      - build-sales
    steps:
      - name: Evaluate results
        run: |
          results='${{ toJSON(needs) }}'
          echo "Job results: $results"
          if echo "$results" | grep -q '"result": "failure"'; then
            echo "::error::One or more checks failed"
            exit 1
          fi
          echo "All checks passed (or were skipped — nothing changed in those modules)."
